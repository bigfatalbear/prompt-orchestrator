name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Valida PWA
        run: |
          test -f apps/web/dist/manifest.webmanifest
          test -f apps/web/dist/sw.js
          grep -q '"display": "standalone"' apps/web/dist/manifest.webmanifest
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
